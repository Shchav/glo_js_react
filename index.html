<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <style>
        table,
        th,
        td {
            border: 1px solid black;
        }
    </style>
</head>

<body>

    <select id="kitchenware">
        <option value="kettle">Чайник</option>
        <option value="saucepan">Кастрюля</option>
    </select>

    <form id="kettle" action="/submit-form" method="POST">
        <div>
            <label for="volume">Объем (л.):</label>
            <input type="number" id="volume" name="volume" required>
        </div>
        <div>
            <fieldset>
                <legend>Можно мыть в подсудомойке?</legend>
                <label for="can_dish_washer_yes">Да</label>
                <input type="radio" id="can_dish_washer_yes" name="can_dish_washer" checked>
                <label for="can_dish_washer_no">Нет</label>
                <input type="radio" id="can_dish_washer_no" name="can_dish_washer">
            </fieldset>
        </div>
        <div>
            <label for="country">Страна производитель:</label>
            <input type="text" id="country" name="country" required>
        </div>
        <div>
            <label for="weight">Вес (кг.):</label>
            <input type="number" id="weight" name="weight" required>
        </div>
        <div>
            <fieldset>
                <legend>Наличие автовыключения?</legend>
                <label for="is_auto_shutdown_yes">Да</label>
                <input type="radio" id="is_auto_shutdown_yes" name="is_auto_shutdown" checked>
                <label for="is_auto_shutdown_no">Нет</label>
                <input type="radio" id="is_auto_shutdown_no" name="is_auto_shutdown">
            </fieldset>
        </div>
        <div>
            <label for="power">Мощность (Вт.):</label>
            <input type="number" id="power" name="power" required>
        </div>
    </form>

    <form id="saucepan" action="/submit-form" method="POST">
        <div>
            <label for="volume">Объем (л.):</label>
            <input type="number" id="volume" name="volume" required>
        </div>
        <div>
            <fieldset>
                <legend>Можно мыть в подсудомойке?</legend>
                <label for="can_dish_washer_yes">Да</label>
                <input type="radio" id="can_dish_washer_yes" name="can_dish_washer" checked>
                <label for="can_dish_washer_no">Нет</label>
                <input type="radio" id="can_dish_washer_no" name="can_dish_washer">
            </fieldset>
        </div>
        <div>
            <label for="country">Страна производитель:</label>
            <input type="text" id="country" name="country" required>
        </div>
        <div>
            <label for="weight">Вес (кг.):</label>
            <input type="number" id="weight" name="weight" required>
        </div>
        <div>
            <label for="max_temperature">Максимально разрешенная температура:</label>
            <input type="number" id="max_temperature" name="max_temperature" required>
        </div>
        <div>
            <fieldset>
                <legend>Входит в набор кастрюль?</legend>
                <label for="from_set_yes">Да</label>
                <input type="radio" id="from_set_yes" name="from_set" checked>
                <label for="from_set_no">Нет</label>
                <input type="radio" id="from_set_no" name="from_set">
            </fieldset>
        </div>
    </form>
    <button type="button">Сохранить</button>

    <table>
        <tr>
            <th>Объем, л.</th>
            <th>Можно ли мыть в посудомойке?</th>
            <th>Страна производитель</th>
            <th>Вес, кг.</th>
            <th>Наличие автовыключения?</th>
            <th>Мощность (Вт.)</th>
            <th>Максимально разрешенная температура</th>
            <th>Входит в набор кастрюль?</th>
            <th></th>
        </tr>
    </table>
</body>

</html>
